    <!-- sistema de gestión de camas -->

    <div class="col-lg-23  " style="background: linear-gradient(to bottom, #052C4E, #0D4678, #2068A9);">
        <div class="container h-100">
            <div class="row no-gutters h-100 align-items-center">  
                <div class="d-flex col-md-8 col-lg-17 col-xl-12 mx-auto" style="justify-content: center;">    
                    <div class="d-flex flex-column justify-content-center align-items-center">
                        <img src="assets/logo-css-origianal.png" style="width: 15%;">
                    
                    
                    <!--  <div class="d-flex flex-column justify-content-center align-items-center text-center" style="background-color: #083D6C;" >
                    -->
                   
                        <h4 style="color: #ffffff; font-size:x-large;">Bienvenido al</h4>
                        <h4 style="font-weight: bold; color: #ffffff; font-size: 200%">SISTEMA DE GESTIÓN DE CAMAS</h4  >
                    
        <!--
                    <p class="m-b-30">Ingrese su Correo</p>
                -->

                <hr>
                <hr>
                
                

                    <form nz-form [formGroup]="loginForm" nzLayout="vertical" class="login-form" (ngSubmit)="submitForm()" style="width: 330px;">
                        <nz-form-item>
                    <!--         <nz-form-label nzRequired nzFor="userName">Correo Electrónico</nz-form-label>  -->
                            <nz-form-control nzErrorTip="Por favor, Ingrese su correo electónico!">
                                <nz-input-group [nzPrefix]="prefixUser" style="border-radius: 10px; height: 40px;">
                                    <input class="rounded" type="text" nz-input formControlName="userName" placeholder="Ingrese su Correo" >
                                </nz-input-group>
                            </nz-form-control>
                        </nz-form-item>

                        <nz-form-item>
                            <!-- <nz-form-label nzRequired nzFor="password">Contraseña</nz-form-label> -->
                            <nz-form-control nzErrorTip="Por favor, Ingrese su contraseña!" >
                                <nz-input-group [nzPrefix]="prefixLock" style="border-radius: 10px; height: 40px;">
                                    <input type="password" nz-input formControlName="password" placeholder="Ingrese su Contraseña">
                                </nz-input-group>
                            </nz-form-control>
                        </nz-form-item>


                        <!-- CLOUDFLARE -->
                        <nz-form-item class="d-flex align-items-center justify-content-center" >
                            <button type="button" class="btn btn-outline-primary w-75" style="color: #ffffff; border-color: #ffffff;">Cloudflare</button>
                        </nz-form-item>


                        <nz-form-item class="justify-content-center">
                            <div class="form-check align-items-center" style="color: #ffffff;">
                                <input class="form-check-input" type="checkbox" value="" id="defaultCheck1">
                                <label class="form-check-label" for="defaultCheck1">
                                  Recordar mi usuario en esta computadora
                                </label>
                              </div>
                        </nz-form-item>


                        <!--BOTON INICIAR SESION-->
                        <nz-form-item>
                            <nz-form-control >
                                <div class="d-flex align-items-center justify-content-center" >
                                    <!-- 
                                    <span class="font-size-13 text-muted">No tienes una cuenta? <a class="small" > Iniciar sesion</a></span>
                                -->    
                                    <button nz-button class="login-form-button" [nzType]="'primary'" style="border-radius: 8px; width: 80%; height: 40px; background-color: #ffffff; color: #083D6C;"><b>Iniciar Sesión</b></button>
                                </div>

                                <div class="d-flex justify-content-center align-items-center pt-4">
                                        <span class="font-size-13 text-muted"><a class="small" style="color: #ffffff;"><b><u>¿Olvido su Contraseña o Usuario?</u></b></a></span>
                                </div>
                            </nz-form-control>
                        </nz-form-item>

                        


                    </form>

                </div>
                    
                    <ng-template #prefixUser><i nz-icon nzType="user"></i></ng-template>
                    <ng-template #prefixLock><i nz-icon nzType="lock"></i></ng-template>
                </div>
            </div>  
        </div>
    </div>
</div>
