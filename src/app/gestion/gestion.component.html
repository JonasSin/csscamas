
<div style="margin: 10px;">

<header class="header-gestion" style="background-color: #FFFFFF;">  
  
    <div class="container" style="display: grid;">
      <p style="display: grid; margin-top: 10px; color: #b19797;">Crear servicios</p>
        <div class="container1" >
            <h1>Control de Camas</h1>
            <p>Servicio para la Gestión y admnistración de camas dentro de la red de hospitales de la CSS</p>
        </div>
            <!--  Usuario registrado  -->
       
    </div>

</header>

<section style="background-color: #FFFFFF;">
    
    <div class="justify-content-between align-items-center">
        
            <div class="container-card">
                <div nz-row [nzGutter]="24">
                  <div nz-col [nzSpan]="6">
                    <nz-card>
                        <i class='fas fa-bed' style="font-size:36px; padding-bottom: 10px;"></i>
                        <h4>Total de Camas</h4>
                        <h2>###</h2>
                        <p class="title-card" style="color: rgb(44, 171, 44);">% vs mes anterior</p>
                      </nz-card>
                  </div>

                  <div nz-col [nzSpan]="6">
                    <nz-card>
                        <i class='fas fa-ban' style='font-size:36px; padding-bottom: 10px;'></i>
                        <h4>Ocupación</h4>
                      <h2>###%</h2>
                      <p class="title-card" style="color: rgb(251, 72, 72);"># vs mes anterior</p>
                    </nz-card>
                  </div>

                  <div nz-col [nzSpan]="6">
                    <nz-card>
                        <i class='fas fa-clock' style='font-size:36px; padding-bottom: 10px;'></i>
                        <h4>Tiempo Promedio</h4>
                      <h2>###</h2>
                      <p class="title-card" style="color: rgb(27, 182, 27);">#.# días</p>
                    </nz-card>
                  </div>

                  <div nz-col [nzSpan]="6">
                    <nz-card>
                        <i class='fas fa-exclamation-triangle' style='font-size:36px; padding-bottom: 10px;'></i>
                        <h4>Alertas Activas</h4>
                      <h2>###</h2>
                      <p class="title-card" style="color: rgb(251, 72, 72);"># nuevas</p>
                    </nz-card>
                  </div>
                </div>
              </div>
    </div>

    <div class="container-2">
        <div style="background: #FFFFFF; ">
            <div nz-row [nzGutter]="8">
              <div nz-col [nzSpan]="14" style="margin-right: 45px;">
                <nz-card nzTitle="Ocupación por Piso">
                  <!--<p>Contenido</p>
                
                  <app-pisos/>-->

                </nz-card>
              </div>
              <div nz-col [nzSpan]="8">
                <nz-card nzTitle="Alertas recientes">
                  <p>Contenido</p>
                </nz-card>
              </div>
            </div>
          </div>
    </div>

    <div class="container-3">
        <div style="background: #FFFFFF;">
            <div nz-row [nzGutter]="8">
              <div nz-col [nzSpan]="14" style="margin-right: 45px; margin-bottom: 30px;">
                <nz-card nzTitle="Estado de camas por sala">
                  <p>Contenido</p>
                </nz-card>
              </div>
              <div nz-col [nzSpan]="8">
                <nz-card nzTitle="Actividades recientes">
                  <p>Contenido</p>
                </nz-card>
              </div>
            </div>
          </div>
    </div>
    

</section>

</div>
